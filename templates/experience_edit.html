{% extends "base.html" %}

{% block meta %}
    <title>Edit Experience - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1>Edit Experience</h1>

            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="form-error">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="project-actions">
                    <button type="submit" class="button">
                        Simpan Perubahan
                    </button>

                    <a
                        href="{% url 'main:show_experience' %}"
                        class="button button-secondary"
                    >
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
